# Server configuration
server.port=8080

# Logging
logging.level.de.hospital=DEBUG

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/triage_db
spring.datasource.username=triage_user
spring.datasource.password=triage_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# DDL-Auto MUSS auf validate (oder none) stehen, da Flyway die Migrationen übernimmt
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
