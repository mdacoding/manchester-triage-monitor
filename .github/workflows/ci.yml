name: CI

# Laeuft bei jedem Push/PR auf main. Nutzt ausschliesslich das kostenlose
# GitHub-Actions-Kontingent (ubuntu-latest Standard-Runner, keine Self-Hosted-
# oder kostenpflichtigen Runner).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Spring Boot / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: mvn -B -q verify
        env:
          # Fester Test-Wert, kein Produktions-Secret.
          JWT_SECRET: ci-only-secret-key-for-github-actions-min-32-chars

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  trigger-render:
    name: Trigger Render Deploy (optional)
    needs: backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy hook when configured
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret – relying on Render auto-deploy from main."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
