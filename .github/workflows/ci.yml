name: CI

# Laeuft bei jedem Push/PR auf main. Nutzt ausschliesslich das kostenlose
# GitHub-Actions-Kontingent (ubuntu-latest Standard-Runner, keine Self-Hosted-
# oder kostenpflichtigen Runner).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: mvn -B -q verify
        env:
          # Fester Test-Wert, kein Produktions-Secret.
          JWT_SECRET: ci-only-secret-key-for-github-actions-min-32-chars

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
