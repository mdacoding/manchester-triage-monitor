# Server configuration
# Render/Fly.io setzen die PORT-Umgebungsvariable dynamisch.
server.port=${PORT:8080}

# Logging
logging.level.de.hospital=DEBUG

# PostgreSQL Database Configuration
# In Produktion (z. B. Render) per Umgebungsvariablen SPRING_DATASOURCE_URL/
# _USERNAME/_PASSWORD ueberschreiben - siehe render.yaml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/triage_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:triage_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:triage_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# DDL-Auto MUSS auf validate (oder none) stehen, da Flyway die Migrationen übernimmt
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT-Authentifizierung
# WICHTIG: In Produktion IMMER per Umgebungsvariable JWT_SECRET ueberschreiben
# (mind. 32 Zeichen, zufaellig generiert, z. B. `openssl rand -base64 48`).
# Der Default-Wert ist NUR fuer lokale Entwicklung/Demo gedacht.
jwt.secret=${JWT_SECRET:demo-only-secret-key-do-not-use-in-production-min-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS - erlaubte Frontend-Origins (kommagetrennt)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator (fuer Health-Checks beim Hosting-Anbieter, z. B. Render)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
